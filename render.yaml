# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: book2voice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: APP_DATA_DIR
        value: /tmp/book2voice
